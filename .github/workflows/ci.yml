name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      staging_url:
        description: Vercel preview URL to exercise after the local checks
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RORC_RUN_SOCKET_TEST: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Enforce strict TypeScript contracts
        run: npm run typecheck

      - name: Run automated tests
        run: npm test

      - name: Enforce receptionist core coverage
        run: npm run test:receptionist-coverage

      - name: Build production assets
        run: npm run vercel-build

      - name: Verify generated assets
        run: |
          npm run check:receptionist-knowledge
          npm run check:app-assets
          git diff --exit-code

      - name: Check browser script syntax
        run: |
          node --check "RORC App/app.js"
          node --check "RORC App/resource-coordinator.js"
          node --check "RORC App/sw.js"
          node --check scripts/rorc-supabase-client.js

      - name: Smoke test the selected staging deployment
        if: github.event_name == 'workflow_dispatch'
        env:
          RORC_SMOKE_BASE_URL: ${{ inputs.staging_url }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: npm run smoke:receptionist
